name: DevSecOps Pipeline

on:
  push:
    branches: [ master, main ]
  pull_request:
    branches: [ master, main ]

jobs:
  security-scan:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # ---- Gate 1: SAST (Semgrep) ----
      - name: SAST - Semgrep scan
        run: |
          pip install semgrep
          semgrep --config "p/javascript" --config "p/sql-injection" routes/ lib/ frontend/src/app/ --json --output=semgrep-results.json || true
          semgrep --config "p/javascript" --config "p/sql-injection" routes/ lib/ frontend/src/app/ || true
        continue-on-error: true

      # ---- Gate 2: Dependency scanning (npm audit) ----
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install --ignore-scripts

      - name: Dependency scan - npm audit
        run: npm audit --audit-level=critical || true
        continue-on-error: true

      # ---- Secrets Management proof: inject GitHub secret at runtime and test ----
      - name: Secrets management - coupon key from GitHub secret
        run: npx tsx test-coupon-secret.ts
        env:
          COUPON_SIGNING_KEY: ${{ secrets.COUPON_SIGNING_KEY }}

      # ---- Gate 3: Secrets scanning (Gitleaks) ----
      - name: Secrets scan - Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

      # ---- Build Docker image (needed for the container scan) ----
      - name: Build Docker image
        run: docker build -t juice-shop-fixed:ci .

      # ---- Gate 4: Container scanning (Trivy) — this is the STRICT gate that FAILS the build ----
      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'juice-shop-fixed:ci'
          format: 'table'
          severity: 'CRITICAL'
          exit-code: '1'